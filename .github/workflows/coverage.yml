name: coverage

on:
  push:
    branches: [ main ]

jobs:
  coverage:
    name: Coverage (gcov)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install gcov
        run: sudo apt-get install -y gcov
      - name: Build with coverage
        run: make coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage
