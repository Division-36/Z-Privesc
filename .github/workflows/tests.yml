name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: |
          make test

  integration:
    name: Integration tests (root in VM)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run integration suite
        run: |
          sudo make test-full
        continue-on-error: false
